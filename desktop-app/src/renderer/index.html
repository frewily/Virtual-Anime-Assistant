<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8080 ws://127.0.0.1:8080; media-src http://127.0.0.1:8080; object-src 'none'; base-uri 'none'; frame-src 'none'">
    <title>桌面助手</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div id="live2d-container"></div>
    <div class="drag-handle" aria-label="拖动桌面助手窗口"></div>
    <div id="assistant-status" role="status">正在加载 Live2D 模型…</div>
    <section
        id="tool-confirmation"
        class="tool-confirmation"
        aria-live="polite"
        aria-labelledby="tool-confirmation-title"
        hidden
    >
        <p class="tool-confirmation__eyebrow">操作确认</p>
        <h2 id="tool-confirmation-title">需要确认的操作</h2>
        <p id="tool-confirmation-name" class="tool-confirmation__tool"></p>
        <pre id="tool-confirmation-arguments"></pre>
        <p id="tool-confirmation-impact"></p>
        <p id="tool-confirmation-expires" class="tool-confirmation__expires"></p>
        <p id="tool-confirmation-error" class="tool-confirmation__error" role="alert"></p>
        <div class="tool-confirmation__actions">
            <button type="button" data-decision="reject">拒绝</button>
            <button
                type="button"
                class="tool-confirmation__approve"
                data-decision="approve"
            >
                允许一次
            </button>
        </div>
    </section>

    <script src="assets/dev-live2d/live2dcubismcore4.min.js"></script>
    <script src="dist/renderer.js"></script>
</body>
</html>
