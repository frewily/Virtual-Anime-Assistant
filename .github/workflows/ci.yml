name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run backend tests
        run: python -m unittest discover -s backend/tests -v
      - name: Run cloud deployment contracts
        run: python -m unittest deploy.cloud.tests.test_cloud_contract -v
      - name: Check cloud scripts
        run: |
          bash -n deploy/cloud/scripts/healthcheck.sh
          bash -n deploy/cloud/scripts/backup-sqlite.sh
          bash -n deploy/cloud/scripts/verify-deployment.sh
          bash -n deploy/cloud/scripts/deploy.sh
      - name: Validate cloud compose
        run: |
          cp deploy/cloud/.env.example deploy/cloud/.env
          cp deploy/cloud/secrets.env.example deploy/cloud/secrets.env
          chmod 0600 deploy/cloud/secrets.env
          docker compose -f deploy/cloud/docker-compose.yml config --quiet
      - name: Build cloud backend image
        run: docker build -f backend/Dockerfile -t vaa-backend:ci .

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install desktop dependencies
        run: npm ci --prefix desktop-app
      - name: Audit production dependencies
        run: npm audit --prefix desktop-app --omit=dev --audit-level=high
      - name: Build and check renderer
        run: npm test --prefix desktop-app
