name: Deploy Cloud

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: vaa-cloud-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH files
        env:
          DEPLOY_KEY: ${{ secrets.VAA_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.VAA_DEPLOY_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          install -d -m 0700 "$RUNNER_TEMP/vaa-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/vaa-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/vaa-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/vaa-ssh/key" "$RUNNER_TEMP/vaa-ssh/known_hosts"

      - name: Deploy verified main commit
        env:
          DEPLOY_HOST: ${{ secrets.VAA_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.VAA_DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.VAA_DEPLOY_PORT }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -Eeuo pipefail
          trap 'rm -rf "$RUNNER_TEMP/vaa-ssh"' EXIT
          ssh -i "$RUNNER_TEMP/vaa-ssh/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/vaa-ssh/known_hosts" \
            -p "$DEPLOY_PORT" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "/opt/virtual-anime-assistant/current/deploy/cloud/scripts/deploy.sh '$TARGET_SHA'"
